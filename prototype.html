<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MealIt - Grocery Price Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles & animations */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb; /* Gray-200 background to frame the app */
        }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbar for a cleaner mobile app look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen sm:p-4">

    <!-- Mobile App Container -->
    <div class="flex flex-col h-screen sm:h-[850px] w-full max-w-md mx-auto bg-gray-50 sm:rounded-[2rem] sm:shadow-2xl relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 pt-8 rounded-b-2xl shadow-md z-10 flex-shrink-0">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">MealIt</h1>
                    <p class="text-indigo-200 text-sm flex items-center mt-1">
                        <svg class="w-4 h-4 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Glasgow, G1 (Near Buchanan)
                    </p>
                </div>
                <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center font-bold text-lg border-2 border-indigo-300 shadow-inner">
                    JS
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto pb-24 p-4 scroll-smooth">
            <!-- Content gets injected here by JS -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 pb-6 sm:pb-4 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] rounded-b-[2rem]">
            <button onclick="switchTab('search')" id="nav-search" class="nav-btn flex flex-col items-center justify-center w-full relative text-indigo-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[10px] font-semibold">Search</span>
            </button>
            <button onclick="switchTab('lists')" id="nav-lists" class="nav-btn flex flex-col items-center justify-center w-full relative text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                <span class="text-[10px] font-semibold">Lists</span>
            </button>
            <button onclick="switchTab('alerts')" id="nav-alerts" class="nav-btn flex flex-col items-center justify-center w-full relative text-gray-400 hover:text-gray-600 transition-colors">
                <div class="relative">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                    <span class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-white border">3</span>
                </div>
                <span class="text-[10px] font-semibold">Alerts</span>
            </button>
            <button onclick="switchTab('receipts')" id="nav-receipts" class="nav-btn flex flex-col items-center justify-center w-full relative text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px] font-semibold">Savings</span>
            </button>
        </nav>
    </div>

    <!-- Application Logic -->
    <script>
        // --- MOCK DATA ---
        const MOCK_PRODUCTS = [
            { id: 1, name: "Relentless Origin Energy Drink", category: "Beverages", details: "500ml", image: "https://placehold.co/200x200/3b82f6/ffffff?text=Relentless" },
            { id: 2, name: "M&M's Peanut Chocolate Candies", category: "Snacks", details: "125g", image: "https://placehold.co/200x200/f59e0b/ffffff?text=M%26Ms" },
            { id: 3, name: "Meal Deal: Sandwich + Snack + Drink", category: "Meal Deals", details: "Various", image: "https://placehold.co/200x200/10b981/ffffff?text=Meal+Deal" }
        ];

        const MOCK_BRANCHES = [
            { id: 101, storeName: "Sainsbury's Local", branchName: "Buchanan Bus Station", distance: "0.1 mi", hours: "07:00 - 23:00" },
            { id: 102, storeName: "Sainsbury's", branchName: "Buchanan Galleries", distance: "0.4 mi", hours: "08:00 - 20:00" },
            { id: 103, storeName: "Tesco Express", branchName: "Sauchiehall St", distance: "0.6 mi", hours: "06:00 - 23:00" }
        ];

        const MOCK_PRODUCT_BRANCHES = [
            // Relentless Prices
            { id: 1, productId: 1, branchId: 101, price: 1.00, memberPrice: null, available: true, restock: "IN_STOCK", offers: ["Deliveroo: Free Delivery", "UNiDAYS: 5% off"] },
            { id: 2, productId: 1, branchId: 102, price: 1.30, memberPrice: null, available: true, restock: "IN_STOCK", offers: [] },
            { id: 3, productId: 1, branchId: 103, price: 1.45, memberPrice: 1.20, available: false, restock: "TOMORROW", offers: ["Clubcard Price"] },
            
            // M&Ms Prices
            { id: 4, productId: 2, branchId: 101, price: 1.75, memberPrice: null, available: true, restock: "IN_STOCK", offers: [] },
            { id: 5, productId: 2, branchId: 102, price: 1.50, memberPrice: 1.25, available: true, restock: "IN_STOCK", offers: ["Nectar Price"] }
        ];

        // --- ICONS ---
        const clockIcon = `<svg class="w-3.5 h-3.5 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        const pinIcon = `<svg class="w-3.5 h-3.5 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
        const tagIcon = `<svg class="w-3 h-3 mr-1 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>`;

        // --- APP STATE ---
        let state = {
            activeTab: 'search',
            searchQuery: '',
            selectedProductId: null
        };

        const appContent = document.getElementById('app-content');

        // --- CORE FUNCTIONS ---
        function render() {
            updateNavigationUI();
            
            appContent.innerHTML = ''; // Clear current
            
            switch (state.activeTab) {
                case 'search':
                    appContent.innerHTML = getSearchTabHTML();
                    attachSearchListeners();
                    break;
                case 'lists':
                    appContent.innerHTML = getListsTabHTML();
                    break;
                case 'alerts':
                    appContent.innerHTML = getAlertsTabHTML();
                    break;
                case 'receipts':
                    appContent.innerHTML = getReceiptsTabHTML();
                    break;
            }
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            // Reset search view if navigating away
            if (tabId !== 'search') {
                state.selectedProductId = null;
                state.searchQuery = '';
            }
            render();
        }

        function updateNavigationUI() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-indigo-600');
                btn.classList.add('text-gray-400');
            });
            document.getElementById(`nav-${state.activeTab}`).classList.add('text-indigo-600');
            document.getElementById(`nav-${state.activeTab}`).classList.remove('text-gray-400');
        }

        // --- SEARCH TAB LOGIC ---
        function getSearchTabHTML() {
            // View 2: Product Comparison
            if (state.selectedProductId) {
                const product = MOCK_PRODUCTS.find(p => p.id === state.selectedProductId);
                return getProductComparisonHTML(product);
            }

            // View 1: Search List
            const filteredProducts = state.searchQuery 
                ? MOCK_PRODUCTS.filter(p => p.name.toLowerCase().includes(state.searchQuery.toLowerCase()))
                : MOCK_PRODUCTS;
            
            let productsHTML = filteredProducts.map(p => `
                <div onclick="selectProduct(${p.id})" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer hover:bg-indigo-50 transition-colors active:scale-95 transform">
                    <img src="${p.image}" alt="${p.name}" class="w-16 h-16 rounded-lg object-cover bg-gray-100 border border-gray-200" />
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800 text-sm leading-tight">${p.name}</h4>
                        <p class="text-xs text-gray-500 mt-1">${p.category} • ${p.details}</p>
                    </div>
                    <div class="text-indigo-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            `).join('');

            if (filteredProducts.length === 0) {
                productsHTML = `<div class="text-center text-gray-500 mt-10 p-6 bg-white rounded-xl shadow-sm"><p>No products found for "${state.searchQuery}".</p></div>`;
            }

            return `
                <div class="animate-fade-in flex flex-col h-full">
                    <!-- Search Bar -->
                    <div class="relative mb-6 sticky top-0 z-10 bg-gray-50 pt-2 pb-2">
                        <input 
                            type="text" 
                            id="search-input"
                            value="${state.searchQuery}"
                            placeholder="Search products, brands..." 
                            class="w-full bg-white border border-gray-200 rounded-xl py-3.5 pl-11 pr-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium"
                        />
                        <div class="absolute left-4 top-5 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 pb-8">
                        <h3 class="font-bold text-gray-700 text-sm uppercase tracking-wider mb-1">Items</h3>
                        ${productsHTML}
                    </div>
                </div>
            `;
        }

        function attachSearchListeners() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                // Set focus back if we are typing
                if (state.searchQuery) {
                    setTimeout(() => {
                        searchInput.focus();
                        searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
                    }, 0);
                }
                
                searchInput.addEventListener('input', (e) => {
                    state.searchQuery = e.target.value;
                    render();
                });
            }
        }

        // Global functions for inline HTML event handlers
        window.selectProduct = function(id) {
            state.selectedProductId = id;
            render();
        };

        window.clearProduct = function() {
            state.selectedProductId = null;
            render();
        };

        function getProductComparisonHTML(product) {
            // Aggregate and sort data
            const comparisons = MOCK_PRODUCT_BRANCHES
                .filter(pb => pb.productId === product.id)
                .map(pb => ({ ...pb, branch: MOCK_BRANCHES.find(b => b.id === pb.branchId) }))
                .sort((a, b) => {
                    const priceA = a.memberPrice || a.price;
                    const priceB = b.memberPrice || b.price;
                    if (priceA !== priceB) return priceA - priceB;
                    return parseFloat(a.branch.distance) - parseFloat(b.branch.distance);
                });

            let comparisonHTML = comparisons.map((item, index) => {
                const isBestDeal = index === 0 && item.available;
                const priceToShow = item.memberPrice ? item.memberPrice.toFixed(2) : item.price.toFixed(2);
                
                let offersHTML = item.offers.map(offer => 
                    `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-800 border border-indigo-200">
                        ${tagIcon} ${offer}
                    </span>`
                ).join('');

                return `
                <div class="bg-white rounded-xl p-4 shadow-sm border ${item.available ? 'border-gray-200' : 'border-red-200 opacity-75'} relative overflow-hidden mb-3">
                    
                    ${isBestDeal ? `
                    <div class="absolute top-0 right-0 bg-green-500 text-white text-[10px] font-bold px-2 py-1 rounded-bl-lg shadow-sm">
                        BEST DEAL
                    </div>` : ''}

                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-2">
                            <h4 class="font-bold text-gray-900">${item.branch.storeName}</h4>
                            <p class="text-sm text-gray-600 flex items-center mt-1">
                                ${pinIcon} 
                                <span class="line-clamp-1">${item.branch.branchName}</span> 
                            </p>
                            <p class="text-xs text-indigo-600 font-semibold ml-4 mt-0.5">${item.branch.distance} away</p>
                            
                            <p class="text-xs text-gray-500 flex items-center mt-2">
                                ${clockIcon} ${item.branch.hours}
                            </p>
                        </div>

                        <div class="text-right flex flex-col justify-start">
                            ${item.memberPrice ? `
                                <div class="text-xs text-gray-400 line-through">£${item.price.toFixed(2)}</div>
                                <div class="text-2xl font-black text-indigo-700">£${item.memberPrice.toFixed(2)}</div>
                            ` : `
                                <div class="text-2xl font-black text-gray-800 mt-1">£${item.price.toFixed(2)}</div>
                            `}
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-gray-100 flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            ${item.available ? `
                                <span class="inline-flex items-center px-2 py-1 rounded text-[10px] uppercase tracking-wider font-bold bg-green-100 text-green-800">
                                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1.5"></div> In Stock
                                </span>
                            ` : `
                                <span class="inline-flex items-center px-2 py-1 rounded text-[10px] uppercase tracking-wider font-bold bg-red-100 text-red-800">
                                    <div class="w-1.5 h-1.5 rounded-full bg-red-500 mr-1.5"></div> Out of Stock
                                </span>
                                <span class="text-[10px] text-gray-500">Restocks: ${item.restock}</span>
                            `}
                        </div>
                        
                        ${offersHTML ? `<div class="flex gap-1.5 flex-wrap mt-1">${offersHTML}</div>` : ''}
                    </div>
                </div>
                `;
            }).join('');

            return `
                <div class="animate-fade-in flex flex-col gap-4 pb-4">
                    <button onclick="clearProduct()" class="text-indigo-600 text-sm font-bold flex items-center gap-1.5 hover:text-indigo-800 w-fit bg-indigo-50 px-3 py-1.5 rounded-lg transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back
                    </button>

                    <!-- Product Header -->
                    <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-100 flex items-center gap-4 relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-indigo-50/50 to-transparent pointer-events-none"></div>
                        <img src="${product.image}" alt="${product.name}" class="w-24 h-24 rounded-xl object-cover bg-white shadow-sm border border-gray-100 relative z-10" />
                        <div class="relative z-10">
                            <h2 class="font-extrabold text-gray-900 text-lg leading-tight">${product.name}</h2>
                            <p class="text-sm text-gray-500 mt-1 font-medium">${product.category} • ${product.details}</p>
                        </div>
                    </div>

                    <div class="flex justify-between items-end mt-2">
                        <h3 class="font-bold text-gray-800 text-lg">Compare Branches</h3>
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Sorted by price</span>
                    </div>

                    <!-- Branch List -->
                    <div class="flex flex-col">
                        ${comparisonHTML}
                    </div>
                </div>
            `;
        }

        // --- PLACEHOLDER TABS ---
        function getListsTabHTML() {
            return `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-black text-gray-900">Grocery Lists</h2>
                        <button class="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">+ New</button>
                    </div>
                    
                    <div class="flex gap-2 mb-6 bg-gray-200/50 p-1 rounded-xl w-fit">
                        <span class="bg-white text-indigo-700 shadow-sm text-sm px-5 py-1.5 rounded-lg font-bold cursor-pointer">Weekly</span>
                        <span class="text-gray-500 text-sm px-5 py-1.5 rounded-lg font-bold cursor-pointer hover:text-gray-800">One-Off</span>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-xl text-gray-900">Weekly Flat Shop</h3>
                                <p class="text-sm text-gray-500 mt-0.5">Last updated today</p>
                            </div>
                            <div class="flex gap-2 items-center">
                                <span class="bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-md font-bold">12 items</span>
                                <button class="text-gray-400 hover:text-indigo-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                            </div>
                        </div>
                        
                        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Total Basket Cost Options</p>
                        
                        <div class="space-y-3">
                            <!-- Split Basket Option -->
                            <div class="flex flex-col p-3 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl border border-indigo-200 relative">
                                <div class="absolute -top-2.5 right-3 bg-gradient-to-r from-indigo-500 to-purple-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm">MAX SAVINGS</div>
                                <div class="flex justify-between items-center">
                                    <div class="pr-4">
                                        <p class="font-bold text-indigo-900 text-sm">Split Basket</p>
                                        <p class="text-xs text-indigo-700 mt-1">Get 8 items at Sainsbury's Bus Stn + 4 at Tesco Express</p>
                                    </div>
                                    <p class="font-black text-xl text-indigo-700">£22.10</p>
                                </div>
                            </div>

                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">Sainsbury's Buchanan</p>
                                    <p class="text-[10px] text-gray-500 mt-0.5">0.4m away • 12/12 in stock</p>
                                </div>
                                <p class="font-bold text-lg text-gray-800">£24.50</p>
                            </div>
                            
                            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                                <div>
                                    <p class="font-bold text-gray-800 text-sm">Tesco Express</p>
                                    <p class="text-[10px] text-gray-500 mt-0.5">0.6m away • 11/12 in stock</p>
                                </div>
                                <p class="font-bold text-lg text-gray-800">£26.80</p>
                            </div>
                        </div>
                        
                        <button class="w-full mt-5 bg-white border-2 border-gray-200 text-gray-700 font-bold py-2.5 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-colors text-sm">
                            Edit List & Compare
                        </button>
                    </div>
                </div>
            `;
        }

        function getAlertsTabHTML() {
            return `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-black text-gray-900">Local Alerts</h2>
                        <button class="text-sm bg-indigo-50 text-indigo-700 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg> Filter</button>
                    </div>
                    
                    <div class="bg-white border border-yellow-200 p-4 mb-4 rounded-2xl shadow-sm relative overflow-hidden">
                        <div class="absolute left-0 top-0 w-1.5 h-full bg-yellow-400"></div>
                        <div class="flex">
                            <div class="flex-shrink-0 bg-yellow-100 p-2 rounded-lg text-yellow-600">
